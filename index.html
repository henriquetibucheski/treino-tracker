<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treino Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  /* ===== TOKENS ===== */
  :root {
    --bg: #0f1117;
    --surface: #171b25;
    --surface-2: #1f2431;
    --surface-3: #2a3040;
    --text: #eef0f6;
    --text-2: #aab1c4;
    --muted-s: #798095;
    --border: #242a38;
    --border-2: #343b4e;
    --accent: #4f8ef7;
    --accent-dim: rgba(79,142,247,.14);
    --green: #3ecf8e;
    --orange: #ff9f43;
    --red: #ff6b6b;
    --r-s: 10px; --r-m: 14px; --r-l: 18px;
    --sh-1: 0 1px 3px rgba(0,0,0,.3);
    --sh-2: 0 8px 24px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: calc(78px + env(safe-area-inset-bottom, 0px));
    -webkit-font-smoothing: antialiased;
    line-height: 1.45;
  }
  .container { max-width: 680px; margin: 0 auto; padding: 0 14px 20px; }
  button, select, input, textarea { font-family: inherit; touch-action: manipulation; }

  /* ===== HEADER ===== */
  header { text-align: center; padding: 20px 0 10px; }
  header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; color: var(--text-2); }
  header h1 span { color: var(--accent); }

  /* ===== STREAK ===== */
  .streak-banner {
    display: grid; grid-template-columns: 1fr 1px 1.15fr 1px 1fr; align-items: center;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-l); padding: 16px 8px; margin-bottom: 12px; box-shadow: var(--sh-1);
  }
  .streak-sep { width: 1px; height: 34px; background: var(--border); }
  .streak-item { text-align: center; }
  .streak-item .num { font-size: 1.65rem; font-weight: 800; letter-spacing: -.02em; line-height: 1.1; }
  .streak-item .lbl { font-size: .625rem; color: var(--muted-s); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; margin-top: 3px; }
  .flame { color: var(--orange); }
  .week-dots { display: flex; gap: 7px; justify-content: center; }
  .week-dot { width: 13px; height: 13px; border-radius: 50%; background: transparent; border: 1.5px solid var(--border-2); transition: all .2s; }
  .week-dot.done { background: var(--green); border-color: var(--green); box-shadow: 0 0 10px rgba(62,207,142,.35); }
  .week-lbl { font-size: .625rem; color: var(--muted-s); text-align: center; margin-top: 7px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

  /* ===== BANNERS DE BLOCO ===== */
  .bloco-banner {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-l); padding: 15px 16px; margin-bottom: 12px; font-size: .85rem;
    box-shadow: var(--sh-1); position: relative; overflow: hidden;
  }
  .bloco-banner::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--fase-cor, var(--accent)); }
  .bloco-banner b { color: var(--text); font-size: .8rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .bloco-banner .meta { color: var(--text-2); font-size: .78rem; margin-top: 5px; }
  .bloco-banner .meta:last-of-type { color: var(--muted-s); }
  .novo-bloco {
    background: linear-gradient(135deg, rgba(62,207,142,.12), var(--surface));
    border: 1px solid rgba(62,207,142,.3); border-radius: var(--r-l);
    padding: 15px 16px; margin-bottom: 12px; font-size: .85rem; box-shadow: var(--sh-1);
  }
  .novo-bloco b { color: var(--green); font-weight: 700; }
  .novo-bloco .meta { color: var(--text-2); font-size: .78rem; margin-top: 5px; }

  /* ===== TIMELINE ===== */
  .tl-wrap { position: relative; margin-top: 14px; padding-top: 4px; }
  .timeline { display: flex; height: 8px; border-radius: 99px; overflow: hidden; gap: 2px; }
  .timeline .seg { height: 100%; border-radius: 2px; }
  .timeline .seg.done { background: var(--green); }
  .timeline .seg.atual { background: var(--accent); box-shadow: 0 0 12px rgba(79,142,247,.5); }
  .timeline .seg.fut { background: var(--surface-3); }
  .timeline .seg.deload { opacity: .4; }
  .tl-marker { position: absolute; top: 0; width: 2px; height: 16px; background: #fff; border-radius: 99px; box-shadow: 0 0 6px rgba(255,255,255,.6); }
  .tl-lbls { display: flex; justify-content: space-between; font-size: .66rem; color: var(--muted-s); margin-top: 8px; }

  /* ===== NAV ===== */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(23,27,37,.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 100;
  }
  nav button {
    background: none; border: none; color: var(--muted-s);
    font-size: .66rem; font-weight: 600; cursor: pointer; padding: 6px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    border-radius: var(--r-s); transition: color .18s;
  }
  nav button .ico { font-size: 1.25rem; filter: grayscale(1) opacity(.6); transition: filter .18s; }
  nav button.active { color: var(--accent); }
  nav button.active .ico { filter: none; }

  /* ===== CARDS ===== */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-l); padding: 18px 16px; margin-bottom: 12px; box-shadow: var(--sh-1);
  }
  h2 { font-size: 1rem; font-weight: 700; letter-spacing: -.01em; margin-bottom: 14px; }
  h3 { font-size: .82rem; font-weight: 700; margin-bottom: 10px; letter-spacing: .02em; }

  /* ===== SELETOR DE TREINO ===== */
  .treino-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-bottom: 12px; }
  .treino-picker button {
    padding: 11px 3px; border-radius: var(--r-m);
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); cursor: pointer; font-size: .95rem; font-weight: 800;
    display: flex; flex-direction: column; align-items: center; gap: 3px; transition: all .18s;
  }
  .treino-picker button .sub { font-size: .58rem; font-weight: 500; color: var(--muted-s); line-height: 1.25; text-align: center; }
  .treino-picker button.selected { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(79,142,247,.35); }
  .treino-picker button.selected .sub { color: rgba(255,255,255,.82); }
  .sugestao { font-size: .78rem; color: var(--text-2); margin-bottom: 12px; }
  .sugestao b { color: var(--green); }
  .corrida-btn {
    width: 100%; padding: 13px; border-radius: var(--r-m); margin-bottom: 16px;
    border: 1px dashed var(--border-2); background: transparent;
    color: var(--text-2); cursor: pointer; font-size: .88rem; font-weight: 700; transition: all .18s;
  }
  .corrida-btn.selected { background: var(--orange); border: 1px solid var(--orange); color: #2a1800; box-shadow: 0 4px 14px rgba(255,159,67,.3); }

  /* ===== CONTROLES DA FICHA ===== */
  .desc-picker { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .desc-picker button {
    padding: 8px 12px; border-radius: 99px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2); cursor: pointer; font-size: .76rem; font-weight: 600; transition: all .18s;
  }
  .desc-picker button.selected { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .aquecimento {
    font-size: .76rem; color: var(--orange); margin-bottom: 14px;
    background: rgba(255,159,67,.08); border: 1px solid rgba(255,159,67,.18);
    border-radius: var(--r-s); padding: 9px 11px;
  }

  /* ===== EXERCÍCIO ===== */
  .exercicio { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-m); padding: 13px 12px; margin-bottom: 9px; }
  .exercicio .ex-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 11px; }
  .exercicio .ex-alvo { font-size: .68rem; color: var(--muted-s); background: var(--surface-3); padding: 3px 8px; border-radius: 99px; font-weight: 600;
    max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-sel-wrap { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
  .ex-select { appearance: none; -webkit-appearance: none; width: auto; max-width: 100%; min-width: 0;
    background: transparent; border: none; border-radius: 0; margin: 0; padding: 0;
    color: var(--text); font-weight: 700; font-size: .9rem; letter-spacing: -.01em;
    text-overflow: ellipsis; white-space: nowrap; overflow: hidden; cursor: pointer; }
  .ex-select option, .ex-select optgroup { background: var(--surface-2); color: var(--text); }
  .ex-caret { color: var(--muted-s); font-size: .55rem; flex-shrink: 0; }

  /* ===== LINHA DE SÉRIE ===== */
  .serie-row { display: flex; align-items: center; gap: 5px; margin-bottom: 7px; }
  .serie-row .s-num { color: var(--muted-s); font-size: .74rem; font-weight: 700; flex-shrink: 0; min-width: 13px; }
  .serie-row input {
    width: 58px; padding: 9px 4px; border-radius: var(--r-s);
    border: 1px solid var(--border-2); background: var(--bg);
    color: var(--text); font-size: 1rem; font-weight: 600; text-align: center; transition: border-color .15s;
  }
  .serie-row input::placeholder { color: #5b6275; font-weight: 400; font-size: .82rem; }
  .serie-row input:focus { outline: none; border-color: var(--accent); background: #12151d; }
  .serie-row .x { color: #4d5468; font-size: .8rem; }
  .serie-row .last { font-size: .68rem; color: var(--muted-s); flex: 1; text-align: right;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .serie-row .rm-set { background: none; border: none; color: #4d5468; cursor: pointer; font-size: .85rem; padding: 4px 2px; flex-shrink: 0; transition: color .15s; }
  .serie-row .rm-set:active { color: var(--red); }
  .serie-row .timer-btn { background: var(--surface-3); border: 1px solid transparent; border-radius: var(--r-s);
    color: var(--text-2); cursor: pointer; font-size: .9rem; font-weight: 700; padding: 9px 0;
    width: 54px; flex-shrink: 0; text-align: center; font-variant-numeric: tabular-nums; transition: all .18s; }
  .timer-btn.rodando { background: var(--accent-dim); color: var(--accent); border-color: rgba(79,142,247,.4); }
  .timer-btn.quase { background: rgba(255,159,67,.16); color: var(--orange); border-color: rgba(255,159,67,.5); }
  .timer-btn.zerado { background: rgba(255,107,107,.16); color: var(--red); border-color: rgba(255,107,107,.55); }
  .add-set { background: none; border: 1px dashed var(--border-2); color: var(--muted-s);
    border-radius: var(--r-s); padding: 8px; width: 100%; cursor: pointer; font-size: .74rem; font-weight: 600; margin-top: 4px; }

  /* ===== BOTÕES ===== */
  .btn-primary {
    width: 100%; padding: 15px; border-radius: var(--r-m); border: none;
    background: var(--green); color: #06251a; font-weight: 800;
    font-size: .98rem; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 16px rgba(62,207,142,.28);
  }
  .btn-primary:active { transform: translateY(1px); }
  .btn-primary.laranja { background: var(--orange); color: #2a1800; box-shadow: 0 4px 16px rgba(255,159,67,.28); }
  .btn-secondary {
    padding: 11px 16px; border-radius: var(--r-s); border: 1px solid var(--border-2);
    background: var(--surface-2); color: var(--text); cursor: pointer; font-size: .82rem; font-weight: 600;
  }
  .btn-danger { border-color: rgba(255,107,107,.35); color: var(--red); background: rgba(255,107,107,.07); }

  /* ===== FORMULÁRIOS ===== */
  textarea {
    width: 100%; padding: 11px; border-radius: var(--r-s); border: 1px solid var(--border-2);
    background: var(--bg); color: var(--text); font-size: .88rem;
    resize: vertical; min-height: 54px;
  }
  textarea::placeholder { color: #5b6275; }
  textarea:focus { outline: none; border-color: var(--accent); }
  input[type="date"] {
    padding: 9px 12px; border-radius: var(--r-s); border: 1px solid var(--border-2);
    background: var(--surface-2); color: var(--text); font-size: .85rem;
  }
  select {
    width: 100%; padding: 12px; border-radius: var(--r-s); border: 1px solid var(--border-2);
    background: var(--surface-2); color: var(--text); font-size: .88rem; font-weight: 600; margin-bottom: 12px;
  }
  .dist-picker { display: flex; gap: 8px; margin-bottom: 12px; }
  .dist-picker button {
    flex: 1; padding: 13px 4px; border-radius: var(--r-m);
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--text); cursor: pointer; font-size: .9rem; font-weight: 700; transition: all .18s;
  }
  .dist-picker button.selected { background: var(--orange); border-color: var(--orange); color: #2a1800; }
  .time-inputs { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .time-inputs input { width: 84px; padding: 12px; border-radius: var(--r-s); border: 1px solid var(--border-2);
    background: var(--bg); color: var(--text); font-size: 1.15rem; font-weight: 700; text-align: center; }
  .time-inputs input:focus { outline: none; border-color: var(--orange); }
  .pace-preview { font-size: .85rem; color: var(--orange); margin-bottom: 14px; min-height: 20px; font-weight: 700; }

  /* ===== CALENDÁRIO ===== */
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .cal-head button { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
    border-radius: var(--r-s); padding: 8px 15px; cursor: pointer; font-size: .9rem; }
  .cal-title { font-weight: 700; font-size: 1rem; letter-spacing: -.01em; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-wd { text-align: center; font-size: .58rem; color: var(--muted-s); padding: 0 0 5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 700; }
  .cal-cell { aspect-ratio: 1 / 1; border-radius: var(--r-s); border: 1px solid var(--border); padding: 4px 3px;
    display: flex; flex-direction: column; gap: 2px; cursor: pointer; overflow: hidden; }
  .cal-cell .dnum { font-size: .68rem; color: var(--text-2); font-weight: 700; }
  .cal-cell.hoje { border-color: var(--text); border-width: 1.5px; }
  .cal-cell.hoje .dnum { color: var(--text); }
  .cal-cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
  .cal-chip { font-size: .54rem; font-weight: 800; border-radius: 4px; padding: 1px 3px; line-height: 1.3; }
  .cal-chip.treino { background: rgba(79,142,247,.28); color: #bcd6ff; }
  .cal-chip.corrida { background: rgba(255,159,67,.24); color: #ffd6a0; }
  .cal-legend { display: flex; flex-wrap: wrap; gap: 7px 12px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: .66rem; color: var(--muted-s); }
  .cal-legend .lg { display: flex; align-items: center; gap: 5px; font-weight: 600; }
  .cal-legend .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }

  /* ===== HISTÓRICO / DETALHE ===== */
  .hist-item { border-bottom: 1px solid var(--border); padding: 13px 0; }
  .hist-item:last-child { border-bottom: none; padding-bottom: 0; }
  .hist-head { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 8px; }
  .hist-head .h-title { font-weight: 700; font-size: .88rem; }
  .hist-head .h-date { color: var(--muted-s); font-size: .74rem; flex-shrink: 0; }
  .hist-body { display: none; margin-top: 10px; font-size: .82rem; }
  .hist-body.open { display: block; }
  .hist-body .h-ex { margin-bottom: 8px; }
  .hist-body .h-ex b { color: var(--accent); font-weight: 700; }
  .hist-body .h-sets { color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* ===== GRÁFICOS E STATS ===== */
  canvas { width: 100%; border-radius: var(--r-s); }
  .chart-info { font-size: .7rem; color: var(--muted-s); margin-top: 8px; text-align: center; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .stat-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-m); padding: 15px 10px; text-align: center; }
  .stat-box .num { font-size: 1.4rem; font-weight: 800; color: var(--accent); letter-spacing: -.02em; line-height: 1.15; }
  .stat-box .lbl { font-size: .62rem; color: var(--muted-s); margin-top: 4px; text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }

  /* ===== DIVERSOS ===== */
  .pr-toast {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--green); color: #06251a; font-weight: 800;
    padding: 13px 22px; border-radius: var(--r-m); z-index: 200;
    box-shadow: var(--sh-2); font-size: .88rem; max-width: 90vw; text-align: center;
    animation: fadein .28s cubic-bezier(.2,.9,.3,1);
  }
  @keyframes fadein { from { opacity: 0; transform: translate(-50%, -14px); } to { opacity: 1; transform: translate(-50%, 0); } }
  .empty { text-align: center; color: var(--muted-s); padding: 32px 12px; font-size: .84rem; line-height: 1.7; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .mb { margin-bottom: 12px; }
</style>
</head>
<body>
<div class="container">
  <header><h1>💪 Treino <span>Tracker</span></h1></header>
  <div id="streak-banner"></div>
  <div id="bloco-banner"></div>
  <div id="view"></div>
</div>

<nav>
  <button data-tab="treino" class="active"><span class="ico">🏋️</span>Treino</button>
  <button data-tab="historico"><span class="ico">📋</span>Histórico</button>
  <button data-tab="progresso"><span class="ico">📈</span>Progresso</button>
  <button data-tab="dados"><span class="ico">⚙️</span>Dados</button>
</nav>

<script>
// ============ PLANO ============
// fase = qual variação de exercícios usar (deloads mantêm os exercícios do bloco anterior)
const BLOCOS = [
  { nome: "Bloco 1 — Base", fase: 1, inicio: "2026-06-29", fim: "2026-07-19", composto: "8–10 reps", isolado: "12–15 reps", rir: "RIR 2–3", obs: "Técnica e consistência. Não vá à falha ainda." },
  { nome: "Bloco 2 — Hipertrofia I", fase: 2, inicio: "2026-07-20", fim: "2026-08-23", composto: "8–12 reps", isolado: "10–15 reps", rir: "RIR 1–2", obs: "Acúmulo de volume. Progressão dupla nas cargas." },
  { nome: "DELOAD", fase: 2, inicio: "2026-08-24", fim: "2026-08-30", composto: "2 séries, ~80% carga", isolado: "2 séries", rir: "RIR 3–4", obs: "Semana leve. Recuperar pra atacar o próximo bloco." },
  { nome: "Bloco 3 — Força-Hipertrofia", fase: 3, inicio: "2026-08-31", fim: "2026-10-04", composto: "5–8 reps", isolado: "8–12 reps", rir: "RIR 1–2", obs: "Cargas mais pesadas nos compostos. Descansos maiores (2–3min)." },
  { nome: "DELOAD", fase: 3, inicio: "2026-10-05", fim: "2026-10-11", composto: "2 séries, ~80% carga", isolado: "2 séries", rir: "RIR 3–4", obs: "Semana leve." },
  { nome: "Bloco 4 — Hipertrofia II", fase: 4, inicio: "2026-10-12", fim: "2026-11-15", composto: "6–10 reps", isolado: "10–15 reps", rir: "RIR 0–1", obs: "Intensidade máxima. Última série dos isolados = drop-set." },
  { nome: "DELOAD", fase: 4, inicio: "2026-11-16", fim: "2026-11-22", composto: "2 séries, ~80% carga", isolado: "2 séries", rir: "RIR 3–4", obs: "Semana leve." },
  { nome: "Bloco 5 — Polimento 🏖️", fase: 5, inicio: "2026-11-23", fim: "2026-12-20", composto: "8–12 reps", isolado: "12–20 reps", rir: "RIR 0–1", obs: "Descansos curtos (45–60s nos isolados). Leve déficit calórico. Reta final!" },
];

// "nome" pode ser uma string (exercício fixo o ano todo) ou um mapa {fase: nome}
// (variação que troca na virada de cada bloco). "alvo" também aceita mapa por fase.
const TREINOS = {
  A: { nome: "Peito, Ombro, Tríceps + Core", aquecimento: "5min bike + 2x15 rotação externa na polia (leve)",
    exercicios: [

// ============ ESTADO ============
const STORAGE_KEY = "treino-tracker-v1";
let state = load();
function load() {
  let s;
  try { s = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch { s = {}; }
  if (!Array.isArray(s.sessoes)) s.sessoes = [];
  if (!Array.isArray(s.corridas)) s.corridas = [];
  if (![60, 90, 120, 180].includes(s.descansoPadrao)) s.descansoPadrao = 90;
  return s;
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let currentTab = "treino";
let selectedTreino = null;
let draftSets = {}; // {exNome: [{peso, reps}]}
let draftDate = hoje();
const draftCorridaInicial = () => ({ distancia: 5, custom: false, distanciaCustom: "", min: "", seg: "" });
let draftCorrida = draftCorridaInicial();
let draftObs = "";
let draftObsCorrida = "";
let draftEscolhas = {}; // {slotIdx: nome} — troca pontual de exercício na ficha do dia

// ---------- RASCUNHO AUTOMÁTICO ----------
// Cada valor digitado é persistido na hora; refresh/fechar não perde nada.
// "Salvar treino/corrida" registra de vez e descarta o rascunho.
const DRAFT_KEY = "treino-tracker-draft-v1";
function salvarRascunho() {
  if (!selectedTreino) { localStorage.removeItem(DRAFT_KEY); return; }
  const d = { treino: selectedTreino, data: draftDate, salvoEm: Date.now() };
  if (selectedTreino === "corrida") { d.corrida = draftCorrida; d.obs = draftObsCorrida; }
  else { d.sets = draftSets; d.obs = draftObs; d.escolhas = draftEscolhas; }
  localStorage.setItem(DRAFT_KEY, JSON.stringify(d));
}
function limparRascunho() {
  localStorage.removeItem(DRAFT_KEY);
  draftObs = ""; draftObsCorrida = "";
  draftEscolhas = {};
}
function restaurarRascunho() {
  let d;
  try { d = JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch { return false; }
  if (!d || !d.treino) return false;
  selectedTreino = d.treino;
  draftDate = d.data || hoje();
  if (d.treino === "corrida") {
    draftCorrida = d.corrida || draftCorridaInicial();
    draftObsCorrida = d.obs || "";
  } else {
    draftSets = d.sets || {};
    draftObs = d.obs || "";
    draftEscolhas = d.escolhas || {};
  }
  return true;
}

function hoje() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function fmtData(iso) {
  const [y,m,d] = iso.split("-");
  return d + "/" + m + "/" + y.slice(2);
}
function diaSemana(iso) {
  return ["dom","seg","ter","qua","qui","sex","sáb"][new Date(iso + "T12:00:00").getDay()];
}

// ============ BLOCO ATUAL ============
function blocoAtual(dataIso) {
  const d = dataIso || hoje();
  return BLOCOS.find(b => d >= b.inicio && d <= b.fim) || null;
}
function faseAtual(dataIso) {
  const d = dataIso || hoje();
  const b = blocoAtual(d);
  if (b) return b.fase;
  if (d > BLOCOS[BLOCOS.length - 1].fim) return 5; // manutenção usa exercícios do polimento
  return 1;
}
function nomeEx(ex, fase) {
  return typeof ex.nome === "string" ? ex.nome : (ex.nome[fase] || ex.nome[1]);
}
function variacoesDoSlot(ex) {
  return typeof ex.nome === "string" ? [ex.nome] : [...new Set(Object.values(ex.nome))];
}
function catalogoExercicios() {
  const nomes = [];
  for (const l of ["A", "B", "C", "D"]) for (const e of TREINOS[l].exercicios) nomes.push(...variacoesDoSlot(e));
  return [...new Set(nomes)].sort((a, b) => a.localeCompare(b));
}
function nomeSlot(letra, idx, fase) {
  return draftEscolhas[idx] || nomeEx(TREINOS[letra].exercicios[idx], fase);
}
function alvoEx(ex, fase) {
  if (!ex.alvo) return null;
  return typeof ex.alvo === "object" ? (ex.alvo[fase] || ex.alvo[1]) : ex.alvo;
}

// ============ STREAK (semanas com 3+ treinos) ============
function inicioSemana(iso) { // segunda-feira da semana
  const d = new Date(iso + "T12:00:00");
  const day = (d.getDay() + 6) % 7; // 0=seg
  d.setDate(d.getDate() - day);
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function semanasMap() {
  const map = {};
  for (const s of state.sessoes) {
    const w = inicioSemana(s.data);
    map[w] = (map[w] || 0) + 1;
  }
  return map;
}
function calcStreak() {
  const map = semanasMap();
  const META = 3;
  const wAtual = inicioSemana(hoje());
  let streak = 0;
  let w = wAtual;
  const atualCompleta = (map[wAtual] || 0) >= META;
  // semana atual em andamento não quebra o streak; se completa, conta
  if (atualCompleta) streak++;
  // semanas anteriores
  let dt = new Date(wAtual + "T12:00:00");
  while (true) {
    dt.setDate(dt.getDate() - 7);
    const wk = dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
    if ((map[wk] || 0) >= META) streak++;
    else break;
  }
  // melhor streak histórico
  const weeks = Object.keys(map).filter(w => (map[w] || 0) >= META).sort();
  let best = 0, run = 0, prev = null;
  for (const wk of weeks) {
    if (prev) {
      const diff = (new Date(wk + "T12:00:00") - new Date(prev + "T12:00:00")) / (7*24*3600*1000);
      run = (diff === 1) ? run + 1 : 1;
    } else run = 1;
    best = Math.max(best, run);
    prev = wk;
  }
  return { streak, best: Math.max(best, streak), estaSemana: map[wAtual] || 0, meta: META };
}

// ============ e1RM e PRs ============
function e1rm(peso, reps) {
  if (!peso || !reps) return 0;
  if (reps === 1) return peso;
  return peso * (1 + reps / 30);
}
function melhorE1rm(exNome, antesDe) {
  let best = 0;
  for (const s of state.sessoes) {
    if (antesDe && s.id === antesDe) continue;
    for (const ex of s.exercicios) {
      if (ex.nome !== exNome) continue;
      for (const set of ex.series) best = Math.max(best, e1rm(set.peso, set.reps));
    }
  }
  return best;
}
function ultimaSessaoDoTreino(letra) {
  const list = state.sessoes.filter(s => s.treino === letra).sort((a,b) => b.data.localeCompare(a.data));
  return list[0] || null;
}
function proximoTreinoSugerido() {
  const ordenadas = state.sessoes.slice().sort((a,b) => b.data.localeCompare(a.data) || (b.id - a.id));
  const ult = ordenadas[0];
  if (!ult) return "A";
  if (ult.treino === "A") {
    // dia de perna alterna B/D: sugere o oposto da última perna feita
    const ultPerna = ordenadas.find(s => s.treino === "B" || s.treino === "D");
    return (ultPerna && ultPerna.treino === "B") ? "D" : "B";
  }
  if (ult.treino === "B" || ult.treino === "D") return "C";
  if (ult.treino === "C") return "A";
  return "A";
}

  const { streak, best, estaSemana, meta } = calcStreak();
  const dots = Array.from({length: meta}, (_, i) =>

function dismissNovoBloco(nome) {
  state.blocoVisto = nome;
  save();

}

function timelineHtml() {
  const ini = new Date(BLOCOS[0].inicio + "T12:00:00");
  const fim = new Date(BLOCOS[BLOCOS.length - 1].fim + "T12:00:00");
  const agora = new Date(hoje() + "T12:00:00");
  const total = fim - ini;
  const pct = Math.min(100, Math.max(0, (agora - ini) / total * 100));
  let segs = "";
  for (const b of BLOCOS) {
    const bi = new Date(b.inicio + "T12:00:00"), bf = new Date(b.fim + "T12:00:00");
    const w = ((bf - bi) + 24 * 3600 * 1000) / total * 100;
    const isDeload = b.nome === "DELOAD";
    let cls = "fut";
    const h = hoje();
    if (h > b.fim) cls = "done";
    else if (h >= b.inicio) cls = "atual";
    segs += `<div class="seg ${cls}${isDeload ? " deload" : ""}" style="width:${w}%" title="${b.nome}: ${fmtData(b.inicio)} a ${fmtData(b.fim)}"></div>`;
  }
  const semanas = Math.max(0, Math.ceil((fim - agora) / (7 * 24 * 3600 * 1000)));
  return `<div class="tl-wrap">
    <div class="timeline">${segs}</div>
    <div class="tl-marker" style="left:${pct.toFixed(1)}%"></div>
    <div class="tl-lbls">
      <span>${fmtData(BLOCOS[0].inicio).slice(0,5)}</span>
      <span>${Math.round(pct)}% concluído · faltam ${semanas} semanas</span>
      <span>🏖️ ${fmtData(BLOCOS[BLOCOS.length-1].fim).slice(0,5)}</span>
    </div>
  </div>`;
}

  let html = `<div class="card">
    <h2>Registrar treino</h2>

      const nome = nomeSlot(selectedTreino, idx, fase);
      const sets = draftSets[nome] || [];

            <select class="ex-select" onchange="trocarExercicio(${idx}, this.value)">

            <span class="ex-caret">▼</span>

        </div>`;
      sets.forEach((set, i) => {
        const lastTxt = ultima && ultima[i] ? `↺ ${ultima[i].peso}×${ultima[i].reps}` : (ultima && ultima[0] ? `↺ ${ultima[0].peso}×${ultima[0].reps}` : "");
        html += `<div class="serie-row">
          <button class="rm-set" onclick="removeSet('${esc(nome)}',${i})">✕</button>
          <span class="s-num">${i+1}.</span>

        </div>`;
      });
      html += `<button class="add-set" onclick="addSet('${esc(nome)}')">+ série</button></div>`;
    });
    html += `<div class="mb"><textarea id="obs-treino" placeholder="Observações (dores, energia, ajustes...)" oninput="draftObs=this.value;salvarRascunho()"></textarea></div>

function esc(s) { return s.replace(/'/g, "\\'"); }
function fmtSerie(st) { return st.peso ? `${st.peso}kg×${st.reps}` : `${st.reps} reps`; }

// ---------- CORRIDA ----------
function selecionarCorrida() {
  selectedTreino = "corrida";
  draftCorrida = draftCorridaInicial();
  draftObsCorrida = "";
  salvarRascunho();
  render();
}
function setDistancia(d) {
  if (d === "custom") draftCorrida.custom = true;
  else { draftCorrida.custom = false; draftCorrida.distancia = d; }
  salvarRascunho();
  render();
}
function setCorridaVal(campo, val) { draftCorrida[campo] = val; salvarRascunho(); }
function mmss(totalSec) {
  const m = Math.floor(totalSec / 60), s = Math.round(totalSec % 60);
  return m + ":" + String(s).padStart(2, "0");
}
function paceStr(secPorKm) { return mmss(secPorKm); }
function distAtual() {
  return draftCorrida.custom ? parseFloat(String(draftCorrida.distanciaCustom).replace(",", ".")) : draftCorrida.distancia;
}
function atualizarPace() {
  const el = document.getElementById("pace-preview");
  if (!el) return;
  const dist = distAtual();
  const t = (parseInt(draftCorrida.min) || 0) * 60 + (parseInt(draftCorrida.seg) || 0);
  el.textContent = (dist > 0 && t > 0) ? `Ritmo: ${paceStr(t / dist)} /km · ${dist} km em ${mmss(t)}` : "";
}

function salvarCorrida() {
  const dist = distAtual();
  const tempoSeg = (parseInt(draftCorrida.min) || 0) * 60 + (parseInt(draftCorrida.seg) || 0);
  if (!dist || dist <= 0) { alert("Informe a distância."); return; }
  if (tempoSeg <= 0) { alert("Informe o tempo (minutos e segundos)."); return; }
  const mesmas = state.corridas.filter(c => Math.abs(c.distancia - dist) < 0.05);
  const melhorPaceAntes = mesmas.length ? Math.min(...mesmas.map(c => c.tempoSeg / c.distancia)) : null;
  const paceAgora = tempoSeg / dist;
  const obs = (document.getElementById("obs-corrida")?.value || "").trim();
  state.corridas.push({ id: Date.now(), data: draftDate, distancia: dist, tempoSeg, obs });
  save();
  limparRascunho();
  selectedTreino = null;
  draftDate = hoje();
  draftCorrida = draftCorridaInicial();
  render();
  if (melhorPaceAntes && paceAgora < melhorPaceAntes - 0.01) toast(`🏆 Recorde nos ${dist}km! ${paceStr(paceAgora)}/km`);
  else toast(`🏃 Corrida salva! ${paceStr(paceAgora)}/km`);
}

function ultimaPerformance(exNome) {
  const sessoes = state.sessoes.slice().sort((a,b) => b.data.localeCompare(a.data) || (b.id - a.id));
  for (const s of sessoes) {
    const ex = s.exercicios.find(e => e.nome === exNome);
    if (ex && ex.series.length) return ex.series;
  }
  return null;
}

function prefillSeries(nome, qtd) {
  const ultima = ultimaPerformance(nome);
  return Array.from({length: qtd}, (_, i) => {
    const ref = ultima ? (ultima[i] || ultima[ultima.length-1]) : null;
    return { peso: ref ? ref.peso : "", reps: "" };
  });
}
function selecionarTreino(letra) {
  selectedTreino = letra;
  draftSets = {};
  draftEscolhas = {};
  const fase = faseAtual(draftDate);
  for (const ex of TREINOS[letra].exercicios) {
    const nome = nomeEx(ex, fase);
    draftSets[nome] = prefillSeries(nome, ex.series);
  }
  draftObs = "";
  salvarRascunho();
  render();
}
function trocarExercicio(idx, novoNome) {
  const fase = faseAtual(draftDate);
  const ex = TREINOS[selectedTreino].exercicios[idx];
  const antigo = nomeSlot(selectedTreino, idx, fase);
  if (novoNome === antigo) return;
  if (draftSets[novoNome]) { alert("Esse exercício já está na ficha de hoje."); render(); return; }
  delete draftSets[antigo];
  if (novoNome === nomeEx(ex, fase)) delete draftEscolhas[idx];
  else draftEscolhas[idx] = novoNome;
  draftSets[novoNome] = prefillSeries(novoNome, ex.series);
  salvarRascunho();
  render();
}
function setVal(exNome, i, campo, val) {
  val = String(val).replace(",", ".").trim();
  draftSets[exNome][i][campo] = val === "" ? "" : parseFloat(val);
  salvarRascunho();
}
function addSet(exNome) {
  const sets = draftSets[exNome];
  const last = sets[sets.length-1];
  sets.push({ peso: last ? last.peso : "", reps: "" });
  salvarRascunho();
  render();
}
function removeSet(exNome, i) {
  draftSets[exNome].splice(i, 1);
  salvarRascunho();
  render();
}

// ---------- TIMER DE DESCANSO ----------
// Um timer ativo por vez, calculado por timestamp-alvo (sobrevive a tela
// bloqueada/troca de app). Sem som: só visual, vermelho ao zerar.
let timerAtivo = null; // { key: "exNome|setIdx", fim: timestamp }
let timerTick = null;
function setDescanso(seg) {
  state.descansoPadrao = seg;
  save();
  render();
}
function iniciarTimer(exNome, i) {
  timerAtivo = { key: exNome + "|" + i, fim: Date.now() + (state.descansoPadrao || 90) * 1000 };
  if (!timerTick) timerTick = setInterval(atualizarTimers, 250);
  atualizarTimers();
}
function atualizarTimers() {
  document.querySelectorAll(".timer-btn").forEach(el => {
    if (!timerAtivo || el.dataset.tkey !== timerAtivo.key) {
      el.textContent = "⏱"; el.className = "timer-btn"; return;
    }
    const resta = Math.ceil((timerAtivo.fim - Date.now()) / 1000);
    if (resta <= 0) {
      el.textContent = "0:00";
      el.className = "timer-btn zerado";
      if (timerTick) { clearInterval(timerTick); timerTick = null; } // nada mais a atualizar
    } else {
      el.textContent = mmss(resta);
      el.className = "timer-btn " + (resta <= 10 ? "quase" : "rodando");
    }
  });
}
function limparTimer() {
  timerAtivo = null;
  if (timerTick) { clearInterval(timerTick); timerTick = null; }
}

function salvarSessao() {
  if (!selectedTreino) return;
  const exercicios = [];
  const prs = [];
  const fase = faseAtual(draftDate);
  for (let idx = 0; idx < TREINOS[selectedTreino].exercicios.length; idx++) {
    const nome = nomeSlot(selectedTreino, idx, fase);
    const series = (draftSets[nome] || [])
      .filter(s => s.reps !== "" && s.reps != null && !isNaN(s.reps))
      .map(s => ({ peso: (s.peso === "" || isNaN(s.peso)) ? 0 : s.peso, reps: s.reps }));
    if (series.length) {
      exercicios.push({ nome, series });
      // detectar PR (só exercícios com carga)
      const bestAntes = melhorE1rm(nome);
      const bestAgora = Math.max(...series.map(s => e1rm(s.peso, s.reps)));
      if (bestAntes > 0 && bestAgora > bestAntes) prs.push(nome);
    }
  }
  if (!exercicios.length) { alert("Preencha pelo menos um exercício!"); return; }
  const obs = document.getElementById("obs-treino").value.trim();
  state.sessoes.push({ id: Date.now(), data: draftDate, treino: selectedTreino, exercicios, obs });
  save();
  limparTimer();
  limparRascunho();
  selectedTreino = null;
  draftSets = {};
  draftDate = hoje();
  render();
  if (prs.length) toast(`🏆 PR! ${prs.join(", ")}`);
  else toast("✅ Treino salvo!");
}

function toast(msg) {
  const t = document.createElement("div");
  t.className = "pr-toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

// ---------- charts (canvas puro) ----------
function setupCanvas(canvas) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.parentElement.clientWidth - 32;
  const h = parseInt(canvas.getAttribute("height"));
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  return { ctx, w, h };
}

function lineChart(canvas, vals, labels, unit, fmt) {
  const { ctx, w, h } = setupCanvas(canvas);
  if (!vals.length) return;
  const f = fmt || (v => Math.round(v) + (unit || ""));
  const FONT = "11px -apple-system, 'Segoe UI', Roboto, sans-serif";
  const pad = { l: 42, r: 14, t: 18, b: 26 };
  const min = Math.min(...vals) * 0.95, max = Math.max(...vals) * 1.05 || 1;
  const X = i => pad.l + (vals.length === 1 ? (w-pad.l-pad.r)/2 : i * (w - pad.l - pad.r) / (vals.length - 1));
  const Y = v => pad.t + (1 - (v - min) / (max - min || 1)) * (h - pad.t - pad.b);
  const base = h - pad.b;
  // grid + eixo Y
  ctx.font = FONT; ctx.lineWidth = 1;
  for (let g = 0; g <= 3; g++) {
    const v = min + (max - min) * g / 3, y = Y(v);
    ctx.strokeStyle = "#232937"; ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
    ctx.fillStyle = "#6d7488"; ctx.textAlign = "right"; ctx.fillText(f(v), pad.l - 8, y + 3.5);
  }
  // área sob a linha
  const grad = ctx.createLinearGradient(0, pad.t, 0, base);
  grad.addColorStop(0, "rgba(79,142,247,.28)");
  grad.addColorStop(1, "rgba(79,142,247,0)");
  ctx.fillStyle = grad; ctx.beginPath(); ctx.moveTo(X(0), base);
  vals.forEach((v, i) => ctx.lineTo(X(i), Y(v)));
  ctx.lineTo(X(vals.length - 1), base); ctx.closePath(); ctx.fill();
  // linha
  ctx.strokeStyle = "#4f8ef7"; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  vals.forEach((v, i) => i === 0 ? ctx.moveTo(X(i), Y(v)) : ctx.lineTo(X(i), Y(v)));
  ctx.stroke();
  // pontos (o último em destaque)
  vals.forEach((v, i) => {
    const ult = i === vals.length - 1;
    ctx.beginPath(); ctx.arc(X(i), Y(v), ult ? 5 : 3, 0, 7);
    ctx.fillStyle = ult ? "#3ecf8e" : "#0f1117"; ctx.fill();
    ctx.strokeStyle = ult ? "#3ecf8e" : "#4f8ef7"; ctx.lineWidth = 2; ctx.stroke();
  });
  // datas no eixo X
  ctx.fillStyle = "#6d7488"; ctx.font = FONT; ctx.textAlign = "center";
  const step = Math.ceil(vals.length / 5);
  labels.forEach((lb, i) => {
    if (i % step !== 0 && i !== vals.length-1) return;
    ctx.textAlign = i === vals.length-1 ? "right" : (i === 0 ? "left" : "center");
    ctx.fillText(lb, X(i) + (i === vals.length-1 ? 4 : (i === 0 ? -4 : 0)), h - 7);
  });
  // valor mais recente
  const lx = X(vals.length-1), ly = Y(vals[vals.length-1]);
  ctx.font = "bold 12px -apple-system, 'Segoe UI', Roboto, sans-serif";
  ctx.textAlign = lx > w - 60 ? "right" : "center";
  ctx.fillStyle = "#3ecf8e"; ctx.fillText(f(vals[vals.length-1]), lx > w - 60 ? lx + 6 : lx, ly - 13);
  ctx.textAlign = "left";
}
function barChart(canvas, vals, labels, meta) {
  const { ctx, w, h } = setupCanvas(canvas);
  const FONT = "10px -apple-system, 'Segoe UI', Roboto, sans-serif";
  const pad = { l: 26, r: 8, t: 12, b: 24 };
  const max = Math.max(meta + 1, ...vals);
  const bw = (w - pad.l - pad.r) / vals.length;
  const base = h - pad.b;
  const r = 3; // cantos arredondados das barras
  // linha da meta
  const yMeta = pad.t + (1 - meta / max) * (h - pad.t - pad.b);
  ctx.strokeStyle = "rgba(255,159,67,.55)"; ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
  ctx.beginPath(); ctx.moveTo(pad.l, yMeta); ctx.lineTo(w - pad.r, yMeta); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = "#ff9f43"; ctx.font = FONT; ctx.textAlign = "left";
  ctx.fillText("meta", 0, yMeta + 3.5);
  vals.forEach((v, i) => {
    const bh = Math.max(v > 0 ? 3 : 0, (v / max) * (h - pad.t - pad.b));
    const x = pad.l + i * bw + bw * 0.16, bwid = bw * 0.68, y = base - bh;
    ctx.fillStyle = v >= meta ? "#3ecf8e" : (v > 0 ? "#4f8ef7" : "#232937");
    if (bh > 0) {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, bwid, bh, [r, r, 0, 0]);
      else ctx.rect(x, y, bwid, bh);
      ctx.fill();
    } else {
      ctx.fillStyle = "#232937"; ctx.fillRect(x, base - 2, bwid, 2);
    }
  });
  // rótulos de semana
  ctx.fillStyle = "#6d7488"; ctx.font = FONT; ctx.textAlign = "center";
  labels.forEach((lb, i) => { if (i % 2 === 0 || i === labels.length - 1) ctx.fillText(lb, pad.l + i * bw + bw / 2, h - 8); });
  ctx.textAlign = "left";
}

// ---------- ABA DADOS ----------
function renderDados(v) {
  v.innerHTML = `<div class="card">
    <h2>Backup e dados</h2>
    <p style="font-size:0.82rem;color:var(--muted);margin-bottom:14px">
      Seus dados ficam salvos neste aparelho. Exporte um backup de vez em quando
      (o arquivo cai na pasta de Downloads — guarde na pasta Treinos do OneDrive).</p>
    <div class="mb" style="display:grid;grid-template-columns:1fr 1fr;gap:9px">
      <button class="btn-secondary" onclick="exportar()">⬇️ Exportar</button>
      <button class="btn-secondary" onclick="document.getElementById('imp').click()">⬆️ Importar</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importar(this)">
    </div>
    <button class="btn-secondary btn-danger" onclick="resetar()">🗑️ Apagar tudo</button>
  </div>
  <div class="card">
    <h3>Sobre o plano</h3>
    <p style="font-size:0.82rem;color:var(--muted)">
      Periodização jun–dez 2026 · 3x/semana (A → perna → C; a perna alterna B força / D prevenção) + corridas de 5 e 10 km registradas à parte.<br><br>
      <b style="color:var(--text)">Progressão dupla:</b> bateu o topo da faixa de reps em todas as séries → sobe a carga e volta pro piso da faixa.<br><br>
      <b style="color:var(--text)">Lembretes:</b> creatina 5g todo dia · proteína 160–180g/dia · qualquer dor irradiada na lombar = parar o exercício.</p>
  </div>`;
}
function exportar() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "treino-backup-" + hoje() + ".json";
  a.click();
}
function importar(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.sessoes)) throw new Error();
      if (!Array.isArray(data.corridas)) data.corridas = [];
      state = data;
      save();
      render();
      toast("✅ Backup importado!");
    } catch { alert("Arquivo inválido."); }
  };
  reader.readAsText(file);
}
function resetar() {
  if (!confirm("Apagar TODOS os dados? Essa ação não pode ser desfeita.")) return;
  if (!confirm("Tem certeza mesmo? Exportou o backup?")) return;
  state = { sessoes: [], corridas: [] };
  save();
  render();
}
